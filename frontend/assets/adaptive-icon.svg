<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background for adaptive icon (no background, just the mosque) -->
  <g transform="translate(512, 540)">
    <!-- Left minaret -->
    <rect x="-320" y="-120" width="45" height="320" fill="#164E63"/>
    <rect x="-325" y="-170" width="55" height="60" fill="#164E63"/>
    <ellipse cx="-297" cy="-185" rx="30" ry="20" fill="#164E63"/>
    <circle cx="-297" cy="-200" r="8" fill="#164E63"/>
    
    <!-- Right minaret -->
    <rect x="275" y="-120" width="45" height="320" fill="#164E63"/>
    <rect x="270" y="-170" width="55" height="60" fill="#164E63"/>
    <ellipse cx="297" cy="-185" rx="30" ry="20" fill="#164E63"/>
    <circle cx="297" cy="-200" r="8" fill="#164E63"/>
    
    <!-- Main base structure -->
    <rect x="-240" y="-100" width="480" height="300" fill="#164E63"/>
    
    <!-- Layered roofline - scalloped effect -->
    <path d="M -240 -100 Q -210 -130 -180 -100 Q -150 -130 -120 -100 Q -90 -130 -60 -100 Q -30 -130 0 -100 Q 30 -130 60 -100 Q 90 -130 120 -100 Q 150 -130 180 -100 Q 210 -130 240 -100 L 240 -100 L -240 -100 Z" fill="#164E63"/>
    
    <!-- Left side onion dome -->
    <ellipse cx="-150" cy="-160" rx="70" ry="55" fill="#164E63"/>
    <ellipse cx="-150" cy="-180" rx="55" ry="40" fill="#164E63"/>
    <ellipse cx="-150" cy="-195" rx="40" ry="25" fill="#164E63"/>
    <circle cx="-150" cy="-215" r="10" fill="#164E63"/>
    <circle cx="-150" cy="-215" r="5" fill="#F5ECD9"/>
    
    <!-- Central large onion dome -->
    <ellipse cx="0" cy="-140" rx="110" ry="85" fill="#164E63"/>
    <ellipse cx="0" cy="-165" rx="90" ry="65" fill="#164E63"/>
    <ellipse cx="0" cy="-185" rx="70" ry="45" fill="#164E63"/>
    <ellipse cx="0" cy="-200" rx="50" ry="28" fill="#164E63"/>
    <circle cx="0" cy="-225" r="14" fill="#164E63"/>
    <circle cx="0" cy="-225" r="7" fill="#F5ECD9"/>
    
    <!-- Right side onion dome -->
    <ellipse cx="150" cy="-160" rx="70" ry="55" fill="#164E63"/>
    <ellipse cx="150" cy="-180" rx="55" ry="40" fill="#164E63"/>
    <ellipse cx="150" cy="-195" rx="40" ry="25" fill="#164E63"/>
    <circle cx="150" cy="-215" r="10" fill="#164E63"/>
    <circle cx="150" cy="-215" r="5" fill="#F5ECD9"/>
    
    <!-- Arched doorway -->
    <path d="M -50 200 L -50 70 Q 0 20 50 70 L 50 200 Z" fill="#F5ECD9"/>
    
    <!-- Windows -->
    <rect x="-180" y="-30" width="40" height="55" rx="20" fill="#F5ECD9"/>
    <rect x="-20" y="-30" width="40" height="55" rx="20" fill="#F5ECD9"/>
    <rect x="140" y="-30" width="40" height="55" rx="20" fill="#F5ECD9"/>
    <rect x="-80" y="-130" width="35" height="45" rx="17" fill="#F5ECD9"/>
    <rect x="45" y="-130" width="35" height="45" rx="17" fill="#F5ECD9"/>
  </g>
</svg>
